<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="50%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Top bar preview (Polybar Forest / Gruvbox) -->
  <rect x="40" y="24" width="1120" height="36" rx="4" fill="#282828" stroke="#505050" stroke-width="1"/>
  <circle cx="64" cy="42" r="5" fill="#fb4934"/>
  <circle cx="82" cy="42" r="5" fill="#fabd2f"/>
  <circle cx="100" cy="42" r="5" fill="#b8bb26"/>
  <text x="124" y="46" font-family="monospace" font-size="12" fill="#ebdbb2" font-weight="bold">1 2 3 4 5</text>
  <text x="540" y="46" font-family="monospace" font-size="12" fill="#ebdbb2" font-weight="bold">cult-of-maxwellism // thinkpad</text>
  <text x="1040" y="46" font-family="monospace" font-size="12" fill="#8ec07c" font-weight="bold">VOL 85%  100%</text>

  <!-- Kitty Terminal Window -->
  <g filter="url(#shadow)">
    <rect x="80" y="90" width="620" height="420" rx="8" fill="#1a1818" stroke="#302b2a" stroke-width="1"/>
    <!-- Window Header -->
    <rect x="80" y="90" width="620" height="32" rx="8" fill="#242020"/>
    <circle cx="102" cy="106" r="5" fill="#a6463d"/>
    <circle cx="118" cy="106" r="5" fill="#9c5f2a"/>
    <circle cx="134" cy="106" r="5" fill="#577644"/>
    <text x="154" y="110" font-family="monospace" font-size="11" fill="#c8c8c8">archmagos-cawl@thinkpad: ~ (kitty)</text>

    <!-- Terminal Contents -->
    <text x="105" y="150" font-family="monospace" font-size="13" fill="#a6463d" font-weight="bold">cult-of-maxwellism</text>
    <text x="260" y="150" font-family="monospace" font-size="13" fill="#c8c8c8">@</text>
    <text x="275" y="150" font-family="monospace" font-size="13" fill="#485a98" font-weight="bold">archlinux</text>
    <text x="105" y="170" font-family="monospace" font-size="12" fill="#4d4d47">-------------------------</text>
    <text x="105" y="195" font-family="monospace" font-size="12" fill="#854551">OS:</text>
    <text x="180" y="195" font-family="monospace" font-size="12" fill="#c8c8c8">Arch Linux x86_64</text>
    <text x="105" y="220" font-family="monospace" font-size="12" fill="#854551">WM:</text>
    <text x="180" y="220" font-family="monospace" font-size="12" fill="#c8c8c8">i3-gaps / KDE Plasma</text>
    <text x="105" y="245" font-family="monospace" font-size="12" fill="#854551">Shell:</text>
    <text x="180" y="245" font-family="monospace" font-size="12" fill="#c8c8c8">bash / fish</text>
    <text x="105" y="270" font-family="monospace" font-size="12" fill="#854551">Terminal:</text>
    <text x="180" y="270" font-family="monospace" font-size="12" fill="#c8c8c8">kitty (Sundried theme)</text>
    <text x="105" y="295" font-family="monospace" font-size="12" fill="#854551">Font:</text>
    <text x="180" y="295" font-family="monospace" font-size="12" fill="#c8c8c8">Libertinus Mono 11pt</text>
    <text x="105" y="320" font-family="monospace" font-size="12" fill="#854551">Editor:</text>
    <text x="180" y="320" font-family="monospace" font-size="12" fill="#c8c8c8">Neovim (lazy.nvim, gruvbox)</text>
    <text x="105" y="345" font-family="monospace" font-size="12" fill="#854551">Bar:</text>
    <text x="180" y="345" font-family="monospace" font-size="12" fill="#c8c8c8">Polybar (forest-gruvbox)</text>

    <!-- Color palette preview blocks -->
    <rect x="105" y="380" width="28" height="16" fill="#302b2a"/>
    <rect x="137" y="380" width="28" height="16" fill="#a6463d"/>
    <rect x="169" y="380" width="28" height="16" fill="#577644"/>
    <rect x="201" y="380" width="28" height="16" fill="#9c5f2a"/>
    <rect x="233" y="380" width="28" height="16" fill="#485a98"/>
    <rect x="265" y="380" width="28" height="16" fill="#854551"/>
    <rect x="297" y="380" width="28" height="16" fill="#9c814e"/>
    <rect x="329" y="380" width="28" height="16" fill="#c8c8c8"/>

    <text x="105" y="440" font-family="monospace" font-size="12" fill="#577644">$</text>
    <text x="120" y="440" font-family="monospace" font-size="12" fill="#c8c8c8">stow -v --adopt bash i3 kitty polybar rofi nvim</text>
  </g>

  <!-- Neovim / Cheatsheet Split Preview -->
  <g filter="url(#shadow)">
    <rect x="730" y="140" width="410" height="460" rx="8" fill="#282828" stroke="#505050" stroke-width="1"/>
    <rect x="730" y="140" width="410" height="30" rx="8" fill="#32302f"/>
    <text x="746" y="159" font-family="monospace" font-size="11" fill="#a89984">nvim: lua/plugins/colorscheme.lua</text>
    <text x="750" y="200" font-family="monospace" font-size="12" fill="#ebdbb2">return {</text>
    <text x="765" y="225" font-family="monospace" font-size="12" fill="#ebdbb2">  "ellisonleao/gruvbox.nvim",</text>
    <text x="765" y="250" font-family="monospace" font-size="12" fill="#ebdbb2">  priority = 1000,</text>
    <text x="765" y="275" font-family="monospace" font-size="12" fill="#8ec07c">  config = function()</text>
    <text x="785" y="300" font-family="monospace" font-size="12" fill="#fabd2f">    vim.o.background = "dark"</text>
    <text x="785" y="325" font-family="monospace" font-size="12" fill="#ebdbb2">    vim.cmd([[colorscheme gruvbox]])</text>
    <text x="765" y="350" font-family="monospace" font-size="12" fill="#8ec07c">  end,</text>
    <text x="750" y="375" font-family="monospace" font-size="12" fill="#ebdbb2">}</text>

    <!-- Bottom Statusline (lualine) -->
    <rect x="730" y="565" width="410" height="24" fill="#1d2021"/>
    <rect x="730" y="565" width="65" height="24" fill="#fb4934"/>
    <text x="740" y="581" font-family="monospace" font-size="11" fill="#282828" font-weight="bold">NORMAL</text>
    <text x="805" y="581" font-family="monospace" font-size="11" fill="#ebdbb2">colorscheme.lua</text>
    <text x="1070" y="581" font-family="monospace" font-size="11" fill="#a89984">utf-8 [lua]</text>
  </g>

  <!-- Ricing badge -->
  <rect x="80" y="540" width="300" height="60" rx="6" fill="#1e1e1e" stroke="#333333" stroke-width="1"/>
  <text x="96" y="565" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ebdbb2">PUBLIC RICER REPOSITORY</text>
  <text x="96" y="585" font-family="sans-serif" font-size="11" fill="#a89984">Managed with GNU Stow · Arch Linux</text>
</svg>
