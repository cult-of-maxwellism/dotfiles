[colors]
background = #000000
foreground = #cfcfcf
accent     = #a89b8c

[bar/mybar]
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "Libertinus Mono:size=13;2"
font-1 = "Font Awesome 6 Free:style=Solid:pixelsize=14"
font-2 = "Font Awesome 6 Brands:pixelsize=14"

modules-left = workspaces nvim
modules-center = cpu memory temperature
modules-right = wlan eth battery date

; Uncomment this to check positioning
; bottom = true

[module/workspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.accent}
label-occupied = %name%
label-urgent = %name%
label-empty =

[module/nvim]
type = custom/script
exec = "pgrep -x nvim >/dev/null && echo ' NVIM' || echo ''"
interval = 5

[module/cpu]
type = internal/cpu
interval = 2
format =   <label>
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 5
format =   <label>
label = %mb_used% / %mb_total%

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 75
format =  <label>
label = %temperature-c%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 95
format-charging =   %percentage%%
format-discharging =   %percentage%%
format-full =   full

[module/wlan]
type = internal/network
interface = wlan0
format-connected =   %essid%
format-disconnected = 

[module/eth]
type = internal/network
interface = eth0
format-connected =   %local_ip%
format-disconnected = 

[module/date]
type = internal/date
interval = 30
date = %a %b %d, %H:%M
label =   %date%

; Example image logo (needs `imagemagick` + `polybar-img`)
[module/logo]
type = custom/script
exec = "echo '⚙️'"
interval = 3600

