[colors]
background = #000000
foreground = #E0DCCF   ; parchment
accent = #7FB069       ; muted natural green
warning = #A67246      ; bronze
alert = #A63D40        ; deep red
highlight = #9A8C98    ; muted lavender-grey

[bar/main]
width = 100%
height = 36
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "Libertinus Mono:size=13;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=13;2"
font-2 = "Font Awesome 6 Brands:style=Regular:size=13;2"

modules-left = i3 nvimspaces
modules-center = date
modules-right = cpu memory temperature battery network

[module/i3]
type = internal/i3
label-focused = " %name%"
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.background}
label-unfocused = " %name%"
label-unfocused-foreground = ${colors.foreground}

[module/nvimspaces]
type = custom/script
exec = ~/.config/polybar/scripts/nvimcount.sh
interval = 5

[module/date]
type = internal/date
interval = 30
date = %a %b %d
time = %H:%M
format = " %date%  %time%"

[module/cpu]
type = internal/cpu
interval = 2
format = " %percentage%%"

[module/memory]
type = internal/memory
interval = 10
format = " %percentage_used%%"

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 75
format = " %temperature-c%"

[module/pulseaudio]
type = internal/pulseaudio
format-volume = "  %percentage%%"
label-muted = " muted"

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 95
format-charging = " %percentage%%"
format-discharging = " %percentage%%"

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = " %essid% %downspeed%/%upspeed%"
format-disconnected = " offline"

[module/separator]
type = custom/text
content = "❧"
content-foreground = ${colors.highlight}
